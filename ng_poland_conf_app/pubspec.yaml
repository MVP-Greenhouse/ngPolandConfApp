name: ng_poland_conf_app
description: NG an JS Poland Conference official app.
publish_to: "none"
version: 1.3.1+15

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1

  # Auth
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # Routing
  go_router: ^17.3.0

  # Dependency Injection
  injectable: ^3.0.0
  get_it: ^9.2.1

  # Utils
  flutter_dotenv: ^6.0.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  logger: ^2.7.0
  collection: 1.19.1
  dartz: 0.10.1

  # UI
  font_awesome_flutter: ^11.0.0
  cached_network_image: 3.4.1
  # rive: 0.14.0-dev.12 // TODO: fix Rive 0.14 migration
  webview_flutter: ^4.14.1
  connectivity_plus: ^7.3.0


  # Networking
  dio: ^5.10.0
  retrofit: ^4.9.2

  # Bloc (state management)
  bloc: ^9.2.1
  flutter_bloc: 9.1.1
  bloc_concurrency: 0.3.0
  rxdart: 0.28.0

  # Codegen annotations
  freezed_annotation: 3.1.0
  json_annotation: ^4.12.0

  #hive
  hive_ce_flutter: ^2.3.3
  hive_ce: ^2.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.15.1
  freezed: 3.2.5
  retrofit_generator: ^10.2.7
  json_serializable: ^6.14.0
  injectable_generator: ^3.0.2
  hive_ce_generator: ^1.10.0


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/icons/dark/
    - assets/icons/light/
    - assets/images/authors/
    - assets/animations/rive/
    - env
